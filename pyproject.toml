[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "python-backend-lab"
version = "0.1.0"
description = "Professional Python backend engineering laboratory."
readme = "README.md"
requires-python = ">=3.14"

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
